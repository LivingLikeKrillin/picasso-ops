<svg xmlns="http://www.w3.org/2000/svg" width="840" height="700" viewBox="0 0 840 700">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
    </marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
    </marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d4654a"/>
    </marker>
    <marker id="gov" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8fa2cc" stroke-width="1.2"/>
    </marker>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#e6e6e6">

    <!-- title block -->
    <text x="20" y="36" font-size="17" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso-ops</text>
    <text x="20" y="56" font-size="12" fill="#9a9a9a">picasso-ops 프로세스 구성과 연계 구조</text>

    <!-- row A: external caller, screen, external reader -->
    <rect x="48" y="84" width="200" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="60" y="107" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Mock MES</text>
    <text x="60" y="123" font-size="11" fill="#9a9a9a">외부 주문 전송과 결과 수신 확인</text>
    <rect x="320" y="84" width="200" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="332" y="107" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ui :5173</text>
    <text x="332" y="123" font-size="11" fill="#9a9a9a">9개 메뉴 운영 화면과 API 프록시</text>
    <rect x="616" y="84" width="184" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="628" y="107" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso-narrator</text>
    <text x="628" y="123" font-size="11" fill="#9a9a9a">근거 응답 파일 읽기와 설명 생성</text>

    <!-- row B: ops-service -->
    <rect x="48" y="196" width="472" height="96" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="60" y="219" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ops-service :8782</text>
    <text x="60" y="235" font-size="11" fill="#9a9a9a">화면의 유일한 백엔드이자 /api 와 /integration/v1 제공</text>
    <text x="60" y="251" font-size="11" fill="#9a9a9a">작업 요청 커밋, outbox 결과 수집 커서, callback 전달</text>
    <text x="60" y="267" font-size="11" fill="#9a9a9a">공유 자원 점유와 대기열 조정, picasso 비의존</text>

    <!-- row C: Postgres, mission-host -->
    <rect x="320" y="332" width="184" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="332" y="355" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Postgres :45432</text>
    <text x="332" y="371" font-size="11" fill="#9a9a9a">3개 스키마 데이터 저장소</text>
    <rect x="616" y="332" width="184" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="628" y="355" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mission-host :8785</text>
    <text x="628" y="371" font-size="11" fill="#9a9a9a">작업 지시 실행과 outbox 관리</text>

    <!-- zone: site launcher, one JVM -->
    <rect x="32" y="420" width="784" height="128" fill="none" stroke="#4a4a4a"/>
    <text x="196" y="438" font-size="11" fill="#9a9a9a">site 런처 단일 JVM 대역 현장</text>
    <rect x="48" y="476" width="168" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="60" y="499" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">registry :8781</text>
    <text x="60" y="515" font-size="11" fill="#9a9a9a">기체 원장과 바인딩 관리</text>
    <rect x="328" y="476" width="168" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="340" y="499" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mimic :8783</text>
    <text x="340" y="515" font-size="11" fill="#9a9a9a">가상 기체 2대 gRPC 모의</text>
    <rect x="616" y="476" width="184" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="628" y="499" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"><tspan font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">셀 대역</tspan> :8784</text>
    <text x="628" y="515" font-size="11" fill="#9a9a9a">셀 신호 제공과 장애 주입</text>

    <!-- picasso: core library, inverted -->
    <rect x="320" y="576" width="200" height="52" fill="#2b3f6b" stroke="#8fa2cc" stroke-width="1.5"/>
    <rect x="324" y="580" width="192" height="44" fill="none" stroke="#fff" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="336" y="599" font-size="12.5" font-weight="700" fill="#fff" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso</text>
    <text x="336" y="615" font-size="11" fill="#cfd6e6">읽기 전용 git 핵심 서브모듈</text>

    <!-- edges: data -->
    <g fill="none" stroke="#e6e6e6" stroke-width="1.2">
      <path d="M180,136 V194" marker-end="url(#data)"/>
      <path d="M220,196 V138" marker-end="url(#data)"/>
      <path d="M420,136 V194" marker-end="url(#data)"/>
      <path d="M520,240 H760 V330" marker-end="url(#data)"/>
      <path d="M412,292 V330" marker-end="url(#data)"/>
      <path d="M616,358 H506" marker-end="url(#data)"/>
      <path d="M180,476 V358 H318" marker-end="url(#data)"/>
      <path d="M96,292 V474" marker-end="url(#data)"/>
      <path d="M328,502 H218" marker-end="url(#data)"/>
    </g>
    <g font-size="10.5" fill="#e6e6e6">
      <text x="172" y="170" text-anchor="end">외부 주문 보냄</text>
      <text x="228" y="170">결과 callback 전달함</text>
      <text x="428" y="170">/api 와 /integration 프록시함</text>
      <text x="532" y="233">작업 지시와 운영자 판단 보냄</text>
      <text x="420" y="316">ops 스키마에 쓰기</text>
      <text x="561" y="351" text-anchor="middle">실행 일지 쓰기</text>
      <text x="249" y="351" text-anchor="middle">기체 원장 쓰기</text>
      <text x="104" y="322">기체 선언, 바인딩, 어댑터 등록함</text>
      <text x="273" y="495" text-anchor="middle">생존 보고 보냄</text>
    </g>

    <!-- edges: command (moves the robot) -->
    <g fill="none" stroke="#d4654a" stroke-width="2">
      <path d="M660,384 V404 H440 V474" marker-end="url(#cmd)"/>
    </g>
    <text x="448" y="452" font-size="10.5" fill="#d4654a">gRPC StartTask 보냄</text>

    <!-- edges: observation -->
    <g fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3">
      <path d="M640,136 V212 H522" marker-end="url(#obs)"/>
      <path d="M520,268 H680 V330" marker-end="url(#obs)"/>
      <path d="M760,384 V474" marker-end="url(#obs)"/>
    </g>
    <g font-size="10.5" fill="#9a9a9a">
      <text x="648" y="170">근거 응답 파일 읽기</text>
      <text x="532" y="261">outbox 결과 커서로 읽기</text>
      <text x="752" y="452" text-anchor="end">GET /cell 읽기</text>
    </g>

    <!-- edges: control (library inclusion) -->
    <g fill="none" stroke="#8fa2cc" stroke-width="1.2" stroke-dasharray="1.5 2.5">
      <path d="M420,576 V550" marker-end="url(#gov)"/>
      <path d="M520,602 H824 V358 H802" marker-end="url(#gov)"/>
    </g>
    <g font-size="10.5" fill="#8fa2cc">
      <text x="428" y="567">라이브러리 모듈 포함함</text>
      <text x="672" y="595" text-anchor="middle">picasso 미들웨어 포함함</text>
    </g>

    <!-- key -->
    <g font-size="10.5" fill="#9a9a9a">
      <path d="M20,668 H44" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
      <text x="50" y="672">데이터 흐름</text>
      <path d="M126,668 H150" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3"/>
      <text x="156" y="672">관측·읽기</text>
      <path d="M225,668 H249" fill="none" stroke="#d4654a" stroke-width="2"/>
      <text x="255" y="672">제어 명령</text>
      <path d="M320,668 H344" fill="none" stroke="#8fa2cc" stroke-width="1.2" stroke-dasharray="1.5 2.5"/>
      <text x="350" y="672">라이브러리 포함</text>
      <rect x="447" y="662" width="14" height="10" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
      <text x="467" y="672">저장소 내부</text>
      <rect x="543" y="662" width="14" height="10" fill="#2b3f6b" stroke="#8fa2cc"/>
      <text x="563" y="672">핵심 모듈</text>
      <rect x="628" y="662" width="14" height="10" fill="none" stroke="#4a4a4a"/>
      <text x="648" y="672">대역·외부</text>
    </g>
  </g>
</svg>
