<svg xmlns="http://www.w3.org/2000/svg" width="840" height="532" viewBox="0 0 840 532">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
    </marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d4654a"/>
    </marker>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#e6e6e6">

    <!-- title block -->
    <text x="20" y="36" font-size="17" font-weight="700">Day-1·Day-2 운영 흐름</text>
    <text x="20" y="56" font-size="12" fill="#9a9a9a">로봇 도입과 임무 준비부터 운영 실행 및 인시던트 대응까지의 흐름</text>

    <!-- zone: Day-1 -->
    <rect x="32" y="84" width="784" height="112" fill="none" stroke="#4a4a4a"/>
    <text x="44" y="100" font-size="11" fill="#9a9a9a">Day-1 준비 단계, 엔지니어 담당</text>
    <rect x="48" y="120" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="60" y="143" font-size="12.5" font-weight="700">로봇 도입</text>
    <text x="60" y="159" font-size="11" fill="#9a9a9a">기체 선언과 바인딩</text>
    <rect x="248" y="120" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="260" y="143" font-size="12.5" font-weight="700">임무 정의와 검증</text>
    <text x="260" y="159" font-size="11" fill="#9a9a9a">초안 검증과 모의 실행</text>
    <rect x="448" y="120" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="460" y="143" font-size="12.5" font-weight="700">임무 활성화</text>
    <text x="460" y="159" font-size="11" fill="#9a9a9a">모의 실행 통과와 사유</text>
    <rect x="648" y="120" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="660" y="143" font-size="12.5" font-weight="700">호출 계약 배포·공개</text>
    <text x="660" y="159" font-size="11" fill="#9a9a9a">임무 버전 배포와 공개</text>

    <!-- zone: Day-2 -->
    <rect x="32" y="244" width="784" height="236" fill="none" stroke="#4a4a4a"/>
    <text x="804" y="260" font-size="11" fill="#9a9a9a" text-anchor="end">Day-2 운영 단계, 운영자·엔지니어</text>
    <rect x="48" y="292" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="60" y="315" font-size="12.5" font-weight="700">작업 요청</text>
    <text x="60" y="331" font-size="11" fill="#9a9a9a">외부 주문과 수동 요청</text>
    <rect x="248" y="292" width="152" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="260" y="315" font-size="12.5" font-weight="700">공유 자원 대기</text>
    <text x="260" y="331" font-size="11" fill="#9a9a9a">스테이션 점유와 대기</text>
    <rect x="448" y="292" width="152" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="460" y="315" font-size="12.5" font-weight="700">작업 지시 실행</text>
    <text x="460" y="331" font-size="11" fill="#9a9a9a">호스트와 mimic 실행</text>
    <rect x="648" y="292" width="152" height="52" fill="#0d1117" stroke="#4a4a4a"/>
    <text x="660" y="315" font-size="12.5" font-weight="700">결과와 수신 확인</text>
    <text x="660" y="331" font-size="11" fill="#9a9a9a">결과 버전 저장과 확인</text>
    <rect x="248" y="400" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="260" y="423" font-size="12.5" font-weight="700">장애 주입</text>
    <text x="260" y="439" font-size="11" fill="#9a9a9a">검증 도구, 엔지니어</text>
    <rect x="448" y="400" width="152" height="52" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
    <text x="460" y="423" font-size="12.5" font-weight="700">인시던트와 판단</text>
    <text x="460" y="439" font-size="11" fill="#9a9a9a">운영 메뉴, 운영자</text>

    <!-- edges: order of steps (data) -->
    <g fill="none" stroke="#e6e6e6" stroke-width="1.2">
      <path d="M200,146 H246" marker-end="url(#data)"/>
      <path d="M400,146 H446" marker-end="url(#data)"/>
      <path d="M600,146 H646" marker-end="url(#data)"/>
      <path d="M724,172 V220 H88 V290" marker-end="url(#data)"/>
      <path d="M200,318 H246" marker-end="url(#data)"/>
      <path d="M400,318 H446" marker-end="url(#data)"/>
      <path d="M600,318 H646" marker-end="url(#data)"/>
      <path d="M168,292 V272 H520 V290" marker-end="url(#data)"/>
      <path d="M480,344 V398" marker-end="url(#data)"/>
    </g>
    <g font-size="10.5" fill="#e6e6e6">
      <text x="406" y="213" text-anchor="middle">공개된 호출 계약으로 접수함</text>
      <text x="344" y="266" text-anchor="middle">필수 자원 없으면 바로 제출함</text>
      <text x="488" y="376">실행 보류됨</text>
    </g>

    <!-- edges: control command (robot moves or field work changes) -->
    <g fill="none" stroke="#d4654a" stroke-width="2">
      <path d="M560,400 V346" marker-end="url(#cmd)"/>
      <path d="M400,426 H424 V330 H446" marker-end="url(#cmd)"/>
    </g>
    <g font-size="10.5" fill="#d4654a">
      <text x="568" y="376">REWORK 판단으로 단위 재실행함</text>
      <text x="416" y="380" text-anchor="end">장애 주입으로 기체 상태 바꿈</text>
    </g>

    <!-- key -->
    <g font-size="10.5" fill="#9a9a9a">
      <path d="M20,508 H44" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
      <text x="50" y="512">단계 순서</text>
      <path d="M115,508 H139" fill="none" stroke="#d4654a" stroke-width="2"/>
      <text x="145" y="512">제어 명령</text>
      <rect x="210" y="502" width="14" height="10" fill="#232a3a" stroke="#8fa2cc" stroke-width="1.5"/>
      <text x="230" y="512">수동 조작 단계</text>
      <rect x="319" y="502" width="14" height="10" fill="#0d1117" stroke="#4a4a4a"/>
      <text x="339" y="512">자동 처리 단계</text>
