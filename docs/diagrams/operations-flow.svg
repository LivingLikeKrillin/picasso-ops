    <text x="522" y="159" font-size="11" fill="#6f6f6f">기체 상세에서</text>

    <rect x="664" y="120" width="128" height="52" fill="#ffffff" stroke="#bdbdbd"/>
    <text x="676" y="143" font-size="12.5" font-weight="700">시운전 완료</text>
    <text x="676" y="159" font-size="11" fill="#6f6f6f">3개 조건 자동 판정</text>

    <!-- zone: Day-2 -->
    <rect x="32" y="228" width="776" height="228" fill="none" stroke="#bdbdbd"/>
    <text x="44" y="244" font-size="11" fill="#6f6f6f">Day-2 운영</text>

    <rect x="202" y="264" width="128" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
