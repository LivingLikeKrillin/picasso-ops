<svg xmlns="http://www.w3.org/2000/svg" width="840" height="512" viewBox="0 0 840 512">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.2"/>
    </marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#b23a1d"/>
    </marker>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#262626">

    <!-- title block -->
    <text x="20" y="36" font-size="17" font-weight="700">운영 흐름</text>
    <text x="20" y="56" font-size="12" fill="#6f6f6f">기체 시운전부터 운영까지 화면 조작 절차와 담당</text>

    <!-- zone: Day-1 -->
    <rect x="32" y="84" width="776" height="112" fill="none" stroke="#bdbdbd"/>
    <text x="44" y="100" font-size="11" fill="#6f6f6f">Day-1 시운전·엔지니어</text>

    <rect x="48" y="120" width="128" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="60" y="143" font-size="12.5" font-weight="700">기체 선언</text>
    <text x="60" y="159" font-size="11" fill="#6f6f6f">로봇·연결 영역</text>

    <rect x="202" y="120" width="128" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="214" y="143" font-size="12.5" font-weight="700">어댑터 등록</text>
    <text x="214" y="159" font-size="11" fill="#6f6f6f">제품, 빌드, 인스턴스</text>

    <rect x="356" y="120" width="128" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="368" y="143" font-size="12.5" font-weight="700">프로파일 리비전</text>
    <text x="368" y="159" font-size="11" fill="#6f6f6f">시험 실행기가 기록</text>

    <rect x="510" y="120" width="128" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
